<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ site.description }}">
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; }
  main { max-width: 46rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
  h1 { font-size: 1.7rem; line-height: 1.25; }
  h2 { font-size: 1.25rem; margin-top: 2rem; }
  h3 { font-size: 1.05rem; }
  a { color: #0b57d0; }
  @media (prefers-color-scheme: dark) { a { color: #8ab4f8; } }
  nav { font-size: .9rem; margin-bottom: 1rem; }
  li { margin: .25rem 0; }
</style>
</head>
<body>
<main>
{% unless page.url == "/" %}<nav><a href="{{ '/' | relative_url }}">All app privacy policies</a></nav>{% endunless %}
{{ content }}
</main>
</body>
</html>
